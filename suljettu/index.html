<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Velattomaks — suljettu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231d2330'/%3E%3C/svg%3E">
<style>
  :root{--paper:#f6f3ec;--ink:#1d2330;--soft:#5b6473}
  @media (prefers-color-scheme:dark){:root{--paper:#1d2330;--ink:#f6f3ec;--soft:#a9b0bd}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;text-align:center}
  h1{font-family:Georgia,serif;font-size:clamp(2.2rem,8vw,4rem);margin-bottom:.6rem}
  p{color:var(--soft);font-size:1.1rem}
</style>
</head>
<body>
<main>
  <h1>Suljettu</h1>
  <p>Velattomaks-sivusto on tällä hetkellä suljettu.</p>
</main>
</body>
</html>
