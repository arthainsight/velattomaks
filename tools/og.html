<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Hanken+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{position:relative;font-family:'Hanken Grotesk',system-ui,sans-serif;color:#1d2330;
    background:#f6f3ec;
    background-image:radial-gradient(900px 500px at 88% -12%,rgba(31,122,84,.13),transparent 60%),
                     radial-gradient(700px 420px at -8% 108%,rgba(176,131,72,.14),transparent 60%)}
  .brand{position:absolute;top:58px;left:72px;display:flex;align-items:center;gap:16px}
  .brand svg{width:54px;height:54px}
  .brand span{font-family:'Fraunces',serif;font-weight:600;font-size:2rem;letter-spacing:-.01em}
  .mid{position:absolute;left:72px;top:212px;right:72px}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:4.1rem;line-height:1.08;
     letter-spacing:-.025em;max-width:20ch}
  h1 em{font-style:italic;color:#1f7a54}
  .date{margin-top:22px;display:inline-flex;align-items:center;gap:14px;
    font-family:'Fraunces',serif;font-size:1.9rem;font-weight:600;color:#1f7a54;letter-spacing:-.01em}
  .date::before{content:"";width:44px;height:3px;background:#1f7a54;border-radius:2px}
  .foot{position:absolute;left:72px;right:72px;bottom:58px;
    display:flex;align-items:baseline;justify-content:space-between}
  .foot p{font-size:1.2rem;color:#5b6473;font-weight:600;white-space:nowrap}
  .url{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:600;color:#1d2330}
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#1d2330"/><path d="M17 29 29 45 48 17" fill="none" stroke="#34a574" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Velattomaks</span>
  </div>
  <div class="mid">
    <h1>Velaton ennen kuin täytän <em>40</em></h1>
    <div class="date">13.10.2027</div>
  </div>
  <div class="foot">
    <p>Julkinen velkaseuranta — oikeilla luvuilla.</p>
    <div class="url">velattomaks.fi</div>
  </div>
</body>
</html>
